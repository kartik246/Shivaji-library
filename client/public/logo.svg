  <path d="M96 74 C65 74 35 62 14 74 L14 116 C35 104 65 116 96 116 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2" stroke-linejoin="round" />
  <path d="M96 82 C68 82 40 72 22 82" stroke="#713F12" stroke-width="2" fill="none" />
  <path d="M96 92 C68 92 40 82 22 92" stroke="#713F12" stroke-width="1.5" fill="none" />

  <!-- Open Book (Right Page) -->
  <path d="M104 74 C135 74 165 62 186 74 L186 116 C165 104 135 116 104 116 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2" stroke-linejoin="round" />
  <path d="M104 82 C132 82 160 72 178 82" stroke="#713F12" stroke-width="2" fill="none" />
  <path d="M104 92 C132 92 160 82 178 92" stroke="#713F12" stroke-width="1.5" fill="none" />

  <!-- Book Spine Base Lines -->
  <path d="M14 122 C40 110 70 122 96 122" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M186 122 C160 110 130 122 104 122" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
